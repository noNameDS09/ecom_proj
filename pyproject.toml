[project]
name = "microservices-dev"
version = "0.1.0"
description = "Local development/test environment for the e-commerce microservices."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.200.0",
  "starlette>=0.41.0,<0.60.0",
  "uvicorn[standard]>=0.32.0,<0.40.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<0.32.0",
  "httpx>=0.27.2,<0.29.0",
  "pyjwt>=2.9.0,<3.0.0",
  "bcrypt>=4.2.0,<5.0.0",
  "prometheus-client>=0.21.0,<0.24.0",
  "aiokafka>=0.11.0,<0.13.0",

  "pytest>=8.3.0,<10.0.0",
  "pytest-asyncio>=0.24.0,<2.0.0",
  "pytest-cov>=6.0.0,<8.0.0",
  "ruff>=0.8.0,<1.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs/common/tests", "services", "tests"]
# importlib mode avoids sys.path/module-name collisions between the per-service
# test directories (all of which are named "tests") and the shared test package.
addopts = "-q --strict-markers --import-mode=importlib"
markers = [
  "integration: end-to-end tests that need Postgres (and optionally Kafka)",
  "kafka: tests that require a running Kafka broker",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint.isort]
known-first-party = ["common"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "SIM105", "B904", "ASYNC109"]

[tool.coverage.run]
source = ["libs/common/src", "services"]
omit = ["*/tests/*"]
