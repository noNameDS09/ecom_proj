[project]
name = "user-service"
version = "0.1.0"
description = "Identity service: registration, login, JWT issuance and refresh rotation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<0.200.0",
  "uvicorn[standard]>=0.32.0,<0.40.0",
  "pydantic>=2.9.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "email-validator>=2.2.0,<3.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "asyncpg>=0.30.0,<0.32.0",
  "pyjwt>=2.9.0,<3.0.0",
  "bcrypt>=4.2.0,<5.0.0",
  "prometheus-client>=0.21.0,<0.24.0",
  "microservices-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/user_service"]
