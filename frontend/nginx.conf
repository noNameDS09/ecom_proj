# Serves the built SPA and acts as the single-origin API gateway: the browser
# only ever talks to this server, which forwards /api/* to the owning service
# (mirroring the Vite dev proxy in vite.config.ts). No CORS needed.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Strip the /api prefix and forward to the owning service.
    location ~ ^/api/products(/.*)?$ { rewrite ^/api(/.*)$ $1 break; proxy_pass http://product-service:8001; }
    location ~ ^/api/auth(/.*)?$     { rewrite ^/api(/.*)$ $1 break; proxy_pass http://user-service:8002; }
    location ~ ^/api/users(/.*)?$    { rewrite ^/api(/.*)$ $1 break; proxy_pass http://user-service:8002; }
    location ~ ^/api/orders(/.*)?$   { rewrite ^/api(/.*)$ $1 break; proxy_pass http://order-service:8003; }

    # Content-hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: client-side routes all serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
